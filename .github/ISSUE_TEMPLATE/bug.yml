name: Bug report
description: Report a reproducible defect that is not already covered by a challenge.
title: "[Bug]: "
labels:
  - status:available
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never include real email, tokens, student data, or complaint details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observable behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest deterministic steps using mock or synthetic data.
      placeholder: |
        1. Start the app in mock mode
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or branch
      description: Which revision did you test?
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Area
      options:
        - Announcements
        - Complaints
        - Mail provider
        - Accessibility
        - Tests or CI
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic data and removed secrets or identifying information.
          required: true
